name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx biome check src/ --reporter=summary

  test:
    runs-on: windows-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

  # A auditoria de 2026-10-06 encontrou zero passos `dotnet` no CI: os 2525
  # testes C# (mais de um quarto da suíte) nunca correram aqui, e o projecto de
  # testes nem sequer era compilado. Comandos idênticos aos gates locais
  # documentados no AGENTS.md. O SDK já vem na imagem do runner — é o mesmo
  # que o release.yml usa no `npm run copy-engine` (dotnet publish).
  dotnet:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: dotnet --info
        shell: pwsh
        run: dotnet --info
      # O runner não traz ffmpeg. Vários testes C# exercitam encoding a sério
      # (FfmpegPathResolver inclui "ffmpeg" no PATH como último candidato): sem
      # binário, os testes de encoders/thumbnail/probe falhavam (16 falhas desde
      # 2026-10-07). Baixa o MESMO asset que a release empacota (Gyan full:
      # libx264 + h264_nvenc + h264_amf) e acrescenta-o ao PATH dos passos seguintes.
      # Os testes que exigem GPU NVIDIA real (ProbeEncoder_*_nvenc, escada NVENC)
      # continuam a fazer pass-and-skip via TestPrerequisites (runners não têm GPU).
      - name: Install ffmpeg (from assets release)
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "ffmpeg"
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $out = Join-Path $dir "ffmpeg.exe"
          Invoke-WebRequest -Uri "https://github.com/optdinho/dinhoopt/releases/download/assets/ffmpeg.exe" -OutFile $out -TimeoutSec 300
          $size = (Get-Item $out).Length
          if ($size -lt 100MB) { throw "ffmpeg.exe baixado parece incompleto: $size bytes" }
          Add-Content -Path $env:GITHUB_PATH -Value $dir
          Write-Host "ffmpeg pronto: $([math]::Round($size/1MB,1)) MB em $dir"
      - name: Build engine + testes (Release)
        run: dotnet build dinho-clips-poc/tests/DiNho.Capture.Poc.Tests/DiNho.Capture.Poc.Tests.csproj -c Release
        run: dotnet build dinho-clips-poc/tests/DiNho.Capture.Poc.Tests/DiNho.Capture.Poc.Tests.csproj -c Release
      - name: Testes C#
        run: dotnet test dinho-clips-poc/tests/DiNho.Capture.Poc.Tests/DiNho.Capture.Poc.Tests.csproj -c Release --no-build

  e2e:
    runs-on: windows-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:e2e
