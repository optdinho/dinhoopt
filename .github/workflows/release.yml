name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # ffmpeg.exe (217MB) não vive no git (ignorado, acima do limite de 100MB).
      # O CI baixa do asset da release vazia 'assets' — criada apenas pra guardar
      # o binário. O copy-engine.js faz o gate do binário antes de publicar.
      # O asset vive em `dinhoopt-releases` (público): `dinhoopt` (fonte) é
      # privado e um download anónimo de lá daria 404.
      - name: Download ffmpeg.exe from assets release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path resources/ffmpeg-custom -Force | Out-Null
          $url = "https://github.com/optdinho/dinhoopt-releases/releases/download/assets/ffmpeg.exe"
          $out = "resources/ffmpeg-custom/ffmpeg.exe"
          Invoke-WebRequest -Uri $url -OutFile $out -TimeoutSec 300
          $size = (Get-Item $out).Length
          if ($size -lt 100MB) { throw "ffmpeg.exe baixado parece incompleto: $size bytes" }
          Write-Host "ffmpeg.exe pronto: $([math]::Round($size/1MB,1)) MB"

      - name: Create .env from secrets
        run: |
          echo "GH_TOKEN=${{ secrets.GH_TOKEN }}" > .env
          echo "LICENSE_API_URL=${{ secrets.LICENSE_API_URL }}" >> .env
          echo "LICENSE_API_TOKEN=${{ secrets.LICENSE_API_TOKEN }}" >> .env

      # Isto era um step só ("npm run publish"), que é a mesma coisa que
      # copy-engine && electron-vite build && electron-builder --publish always.
      # Mesma semântica de encadeamento — um step que falha aborta os seguintes —
      # mas cada stage passa a ter o seu nome no log. A 2.0.6 e as anteriores
      # falharam com "Build + publish installer" e nenhuma pista de qual dos três
      # passos era; sem os logs do run não há como distinguir restore do NuGet de
      # gate do ffmpeg de upload, e adivinhar seria chute.
      - name: Stage engine (dotnet publish + ffmpeg gate)
        run: npm run copy-engine

      - name: Stage build (electron-vite)
        run: npm run build

      # Gera o `release-notes.md` a partir do `CHANGELOG.md` para a versão do
      # package.json. O electron-builder usa-o como body da release
      # (`releaseInfo.releaseNotesFile`); sem isto o body nascia vazio e era
      # corrigido à mão via API. O script falha o step se o CHANGELOG não tiver
      # secção para a versão, antes de qualquer upload.
      - name: Stage release notes (CHANGELOG -> release-notes.md)
        run: npm run release:notes

      # Cria a release no GitHub de forma IDEMPOTENTE antes do electron-builder.
      # Sem isto, os publishers nsis+portable correm em paralelo e disputam a
      # criacao da release: um cria, o outro leva 422 `already_exists` e o run
      # morre a meio (foi o run 37928024831 - so o .blockmap subiu). Com a
      # release ja criada, os publishers encontram-na e apenas sobem os assets.
      - name: Stage ensure release (idempotent)
        run: npm run release:ensure
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Stage publish (electron-builder)
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      # PONTE PARA OS CLIENTES ANTIGOS (temporária — ligar com a variável de
      # repositório BRIDGE_MIRROR=1 só durante a migração; desligar depois).
      #
      # Os clientes <= 2.1.12 têm o feed antigo gravado no exe
      # (`repo: dinhoopt`). Quando `dinhoopt` ficar privado, o `GET` anónimo do
      # `releases/latest` passa a 404 e eles nunca mais atualizam. Este step
      # espelha os MESMOS bytes (mesmo `latest.yml`, mesmo sha512 — não há
      # segundo build) para uma release no repo antigo, para que esses clientes
      # apanhem esta versão e passem a consultar o feed novo.
      #
      # `--verify-tag` é obrigatório: a tag já existe (foi ela que disparou este
      # run). Sem ele, o `gh` criaria a tag no repo antigo e o `release.yml`
      # (`on: push: tags: v*`) dispararia um build completo duplicado.
      - name: Mirror release to legacy repo (bridge)
        if: success() && vars.BRIDGE_MIRROR == '1'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          "a espelhar $tag para optdinho/dinhoopt (ponte)"
          gh api "repos/optdinho/dinhoopt/releases/tags/$tag" --silent 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo optdinho/dinhoopt --verify-tag --title $tag --notes-file release-notes.md
          }
          gh release upload $tag --repo optdinho/dinhoopt --clobber dist/latest.yml dist/*.exe dist/*.blockmap

      # O electron-builder publicar não é o mesmo que o auto-update estar a caminho:
      # pode uploading correr bem e o CDN continuar a servir um `latest.yml` antigo. Foi
      # exactamente o que a auditoria à 2.0.6 encontrou — a release existia na API e o
      # `dist/latest.yml` era órfão. Este step fecha o ciclo e falha o job se o feed não
      # expuser a versão acabada de construir.
      #
      # Só metadados: o sha512 do que foi uploaded é conferido aqui, e descarregar os
      # 250 MB no CI só serviria para repetir o que o electron-builder já garantiu.
      # `verify:release:full` continua disponível para quando se quer a descarga.
      #
      # `if: always()` para também correr quando o publish falhou: aí o resultado útil
      # é ver que o feed ficou na versão anterior, o que distingue "não publicou" de
      # "publicou mas o feed não propagou".
      - name: Verify auto-update feed serves this build
        if: always()
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          "a verificar se o feed expoe a versão $version"
          npm run verify:release -- --expect $version

      # Corre mesmo quando um stage acima falha, para o próximo run com nome errado
      # dizer qual era. `dotnet --info` é a primeira coisa a suspectar num build de
      # .NET 10 num runner que muda de imagem.
      - name: Diagnostics
        if: always()
        shell: pwsh
        run: |
          "--- node ---"
          node -v
          npm -v
          "--- dotnet ---"
          dotnet --info
          "--- artifacts ---"
          Get-ChildItem dist -ErrorAction SilentlyContinue |
            Select-Object Name, Length, LastWriteTime |
            Format-Table -AutoSize
          "--- env (sem segredos) ---"
          "GH_TOKEN definido: $([bool]$env:GH_TOKEN)"
          "NUGET_PACKAGES: $($env:NUGET_PACKAGES)"
