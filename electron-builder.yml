appId: com.dinhooptimizer.win32
productName: DiNho Optimizer
copyright: Copyright © 2026 DiNho

directories:
  buildResources: resources
  output: dist

files:
  - out/**/*

extraResources:
  - from: resources/icon.ico
    to: icon.ico
  - from: resources/icon.png
    to: icon.png
  - from: resources/clips-engine-staging
    to: clips-engine
    filter:
      - "**/*"

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: resources/icon.ico
  requestedExecutionLevel: requireAdministrator
  # Strip unused Chromium locales (~10-15MB) — app ships its own i18n (en/pt/es).
  electronLanguages:
    - pt-BR
    - en-US
    - es

# ffmpeg.exe (212MB) compresses well — smaller installer at cost of slower build.
compression: maximum

# Security fuses (applied at package time by electron-builder ≥26).
# App runs elevated — hardening the binary matters. Verified safe:
# no ELECTRON_RUN_AS_NODE / NODE_OPTIONS / --inspect usage; relaunch uses exe directly;
# --cli/--daemon flags are unaffected by these fuses.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableCookieEncryption: true
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
  loadBrowserProcessSpecificV8Snapshot: false

publish:
  provider: github
  owner: optdinho
  repo: dinhoopt
  private: true

# better-sqlite3 v13 loads its prebuilt from prebuilds/win32-x64.node via N-API
# (no compilation needed) — skip @electron/rebuild, which would require Python+MSVC.
npmRebuild: false

asarUnpack:
  - "node_modules/better-sqlite3/**"
  - "node_modules/@litko/yara-x-win32-x64-msvc/**"

electronDownload:
  mirror: https://github.com/electron/electron/releases/download/

nsis:
  oneClick: true
  allowToChangeInstallationDirectory: false
  deleteAppDataOnUninstall: false
  artifactName: DiNho-Optimizer-Setup-${version}.${ext}
  runAfterFinish: true
  createStartMenuShortcut: true
  createDesktopShortcut: true


