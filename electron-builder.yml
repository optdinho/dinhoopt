appId: com.dinhooptimizer.win32
productName: DiNho Optimizer
copyright: Copyright © 2026 DiNho

directories:
  buildResources: resources
  output: dist

files:
  - out/**/*

# asar LIGADO (reativado em 2026-09-30).
#
# Historia: em 2026-08-23 o asar foi DESLIGADO (commit 1276170) por causa de um
# bug do leitor C++ de asar do Chromium: o netstack do renderer devolvia
# ERR_FILE_NOT_FOUND no mainframe (tela preta no app empacotado), enquanto o
# `fs` do Node lia o mesmo asar normalmente. Root cause nao foi isolada.
#
# RETESTE 2026-09-30 (Electron 44.4.5 + electron-vite 6.0.0-beta.4, build --dir):
# o bug NAO reproduz. app.asar gerado (78,7 MB) + app.asar.unpacked com os 78
# arquivos nativos, e o app empacotado ABRE e carrega a UI: janela com titulo
# "Inicio - DiNho Optimizer", 4 processos Responding=True, renderer executando
# as varreduras em background (useBackgroundScans) e ZERO ocorrencias de
# ERR_FILE_NOT_FOUND/netstack no JSONL. Provavelmente corrigido upstream - o
# Electron reescreveu a camada de leitura de asar (PR #52833, 2026) para servir
# fd/stream/copyFile direto do archive em vez de extrair copia temporaria.
#
# Ganho medido: win-unpacked de 10.939 arquivos -> 449 (-96%). O Defender
# escaneia POR ARQUIVO ESCRITO, entao ~10.939 operacoes de scan no install caem
# para ~449. Habilita tambem nsis.differentialPackage "store-asar" (delta de
# update proporcional ao que mudou, em vez de rebaixar o asar inteiro).
#
# INVARIANTE: better-sqlite3 e @litko/yara-x-win32-x64-msvc DEVEM continuar em
# asarUnpack (ver bloco asarUnpack abaixo) - sao modulos nativos carregados por
# dlopen e nao podem ficar dentro do archive.
asar: true

extraResources:
  - from: resources/icon.ico
    to: icon.ico
  - from: resources/icon.png
    to: icon.png
  - from: resources/elevate.exe
    to: elevate.exe
  - from: resources/clips-engine-staging
    to: clips-engine
    filter:
      - "**/*"

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: resources/icon.ico
  requestedExecutionLevel: asInvoker
  # Strip unused Chromium locales (~10-15MB) — app ships its own i18n (en/pt/es).
# ffmpeg.exe (212MB) compresses well — smaller installer at cost of slower build.
compression: maximum

# Security fuses (applied at package time by electron-builder ≥26).
# App runs elevated — hardening the binary matters. Verified safe:
# no ELECTRON_RUN_AS_NODE / NODE_OPTIONS / --inspect usage; relaunch uses exe directly;
# --cli/--daemon flags are unaffected by these fuses.
#
# Asar integrity (2026-11-08): os dois ultimos passaram a true. Sem eles,
# `asar extract` -> editar -> `asar pack` produzia um app que arrancava, porque:
#   - enableEmbeddedAsarIntegrityValidation=false: nada comparava o hash do
#     app.asar com o gravado no exe;
#   - onlyLoadAppFromAsar=false: se o app.asar faltasse (apagado/renomeado), o
#     Electron caia para uma pasta `app/` ao lado do exe e corria-a. Medido em
#     2026-11-08: com o fusivel off executou um app falso plantado em
#     resources/app (`HIJACKED v9.9.9`); com ele on nao corre nada.
# Com ambos a true, um app.asar alterado nao arranca.
# Limites medidos: a validacao e por ficheiro/bloco (blockSize 4 MB) + hash do
# header, portanto acrescentar bytes ao FIM do asar nao e detetado — mas tambem
# nao altera nenhum ficheiro executado. NAO cobre app.asar.unpacked
# (better-sqlite3), resources/clips-engine (motor C#) nem ffmpeg.exe, que ficam
# fora do hash. E nao impede rebuild a partir do source; so trava a adulteracao
# do binario instalado.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableCookieEncryption: true
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
  loadBrowserProcessSpecificV8Snapshot: false

publish:
  provider: github
  owner: optdinho
  # `dinhoopt` (fonte) e PRIVADO desde a migracao de 2026-11; os binarios vivem
  # em `dinhoopt-releases`, que e PUBLICO. O feed tem de continuar publico:
  # `resources/app-update.yml` e gerado aqui e lido sem token em producao
  # (index.ts so carrega o .env quando !app.isPackaged).
  repo: dinhoopt-releases
  # public: false (omitido) — optdinho/dinhoopt-releases é repo PÚBLICO. Com
  # `private: true` o electron-updater tentaria authenticate com GH_TOKEN no
  # feed .atom, e em producao esse token nao existe, quebrando o auto-update.
  # Repo publico = feed anonimo, sem token.
  private: false
  # O electron-builder 26 usa `options.draft === false ? "release" : "draft"`
  # (electron-publish/out/gitHubPublisher.js:55), ou seja, SEM isto toda
  # release nasce como rascunho invisivel para o publico. So o --publish always
  # nao basta: e preciso declarar releaseType. Sem esta linha a 2.0.2 ficou
  # presa em draft e o badge "Baixar" do README apontava para nada.
  releaseType: release

# Body da release no GitHub. O electron-builder le este ficheiro em
# `resolveReleaseBody` (app-builder-lib/out/publish/PublishManager.js) e usa o
# conteudo como release body. Sem isto, cada release nascia com o body vazio e
# tinha de ser corrigido a mao via API (PATCH /releases/<id>). O
# `scripts/gen-release-notes.js` gera-o a partir do CHANGELOG.md para a versao do
# package.json, e corre no `npm run publish` e no CI antes do electron-builder.
releaseInfo:
  releaseNotesFile: release-notes.md

# better-sqlite3 v13 loads its prebuilt from prebuilds/win32-x64.node via N-API
# (no compilation needed) — skip @electron/rebuild, which would require Python+MSVC.
npmRebuild: false

asarUnpack:
  - "node_modules/better-sqlite3/**"
  - "node_modules/@litko/yara-x-win32-x64-msvc/**"

electronDownload:
  mirror: https://github.com/electron/electron/releases/download/

nsis:
  oneClick: true
  allowToChangeInstallationDirectory: false
  deleteAppDataOnUninstall: false
  artifactName: DiNho-Optimizer-Setup-${version}.${ext}
  # The app auto-elevates at first launch (src/main/index.ts), so a running
  # instance is ELEVATED. A user-level installer cannot terminate it before
  # copying files (taskkill Access denied -> CHECK_APP_RUNNING gives up with
  # appCannotBeClosed and the install aborts). perMachine makes the installer
  # request admin, so CHECK_APP_RUNNING's kill succeeds and runAfterFinish
  # relaunches the app after the install. installSection.nsh also uninstalls a
  # previous per-user (HKCU) install, so migration is automatic.
  perMachine: true
  runAfterFinish: true
  createStartMenuShortcut: true
  createDesktopShortcut: true

portable:
  # Nome sem espacos de proposito. O default seria `${productName}-${version}`
  # ("DiNho Optimizer-2.1.13.exe"): o electron-builder sobe-o como
  # "DiNho-Optimizer-2.1.13.exe" (troca o espaco por hifen), mas o step de
  # espelho usa `gh release upload`, que troca o espaco por PONTO — o mesmo
  # binario ficava com nome diferente em cada repo (visto na 2.1.13:
  # `DiNho-Optimizer-2.1.13.exe` vs `DiNho.Optimizer.2.1.13.exe`). Os bytes
  # eram identicos (sha256 igual); era so o nome. Fixar o nome aqui resolve-o
  # na origem para as proximas releases.
  artifactName: DiNho-Optimizer-${version}.${ext}
