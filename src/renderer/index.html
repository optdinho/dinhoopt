<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://github.com https://cdn.dinho.app https://crimson-wildflower-4de0.mirandaotabol.workers.dev; media-src 'self' file: clip-video:; frame-src 'none'; object-src 'none'" />
    <link rel="icon" type="image/x-icon" href="./src/assets/logo.ico" />
    <title>DiNho Optimizer</title>
    <script>
      try {
        const theme = localStorage.getItem('theme') || 'dark'
        if (theme === 'light') document.documentElement.classList.remove('dark')
        else document.documentElement.classList.add('dark')
        document.documentElement.classList.add(theme)
      } catch {}
    </script>
  </head>
  <body class="bg-zinc-950 text-zinc-50 antialiased">
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
